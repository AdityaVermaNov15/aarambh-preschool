<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243A73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aarambh">
<title>Aarambh Pre School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#1B2340; --muted:#5B6480; --line:#E1E6F0;
  --navy:#243A73; --btn:#243A73; --btn-ink:#FFFFFF;
  --sun:#F08A24; --copper:#B9612B; --leaf:#3F8F2F; --berry:#A61E32; --tint:#EAF0FB;
  --ok:#23813A; --ok-bg:#E3F4E6; --bad:#B8322A; --bad-bg:#FBE6E4; --warn:#9A5B00; --warn-bg:#FFF1D9;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 6px 18px rgba(20,30,60,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320; --card:#191F2F; --ink:#E8EBF4; --muted:#9BA4BE; --line:#283049;
    --navy:#9DB3F2; --btn:#3A58B0; --btn-ink:#FFFFFF; --tint:#1E2741;
    --ok:#6FD387; --ok-bg:#16301E; --bad:#FF8A80; --bad-bg:#3A1A1A; --warn:#FFC266; --warn-bg:#3A2A10;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320; --card:#191F2F; --ink:#E8EBF4; --muted:#9BA4BE; --line:#283049;
  --navy:#9DB3F2; --btn:#3A58B0; --btn-ink:#FFFFFF; --tint:#1E2741;
  --ok:#6FD387; --ok-bg:#16301E; --bad:#FF8A80; --bad-bg:#3A1A1A; --warn:#FFC266; --warn-bg:#3A2A10;
  --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Mukta,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Baloo 2",Mukta,system-ui,sans-serif;line-height:1.15;margin:0;color:var(--ink)}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
img,video{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.shell{max-width:620px;margin:0 auto;min-height:100%;padding-bottom:88px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.pad{padding:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:cover;border:1px solid var(--line)}
.brand b{display:block;font-family:"Baloo 2";font-size:1.15rem;line-height:1;letter-spacing:.02em;color:var(--navy)}
.brand small{display:block;font-size:.8rem;color:var(--berry);font-weight:600;line-height:1.2}
:root[data-theme="dark"] .brand small{color:#F08A9A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand small{color:#F08A9A}}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.2rem;cursor:pointer}
.bell .dot{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--berry);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}

/* hero */
.hero{position:relative;overflow:hidden;margin:14px 16px 0;border-radius:22px;background:linear-gradient(180deg,#FFF6EA 0%,#FFE7C7 100%);color:#1B2340;min-height:168px;padding:18px 18px 54px}
:root[data-theme="dark"] .hero{background:linear-gradient(180deg,#2A2440 0%,#3A2A2A 100%);color:#F3EEE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(180deg,#2A2440 0%,#3A2A2A 100%);color:#F3EEE6}}
.hero h1{color:inherit;font-size:1.7rem;max-width:62%;position:relative;z-index:1}
.hero p{position:relative;z-index:1;max-width:60%;opacity:.8}
.hero .role{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:999px;background:rgba(36,58,115,.12);font-weight:600;font-size:.82rem;position:relative;z-index:1}
.hero svg{position:absolute;right:-30px;bottom:0;width:92%;max-width:480px;height:auto;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .hero .rays line{transform-origin:330px 150px;animation:rise .9s ease-out both}
  .hero .sunball{animation:sunup 1s ease-out both}
  @keyframes rise{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  @keyframes sunup{from{transform:translateY(40px)}to{transform:none}}
}

/* cards */
.section{padding:0 16px;margin-top:18px}
.section>h2{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:"Baloo 2";font-size:1.5rem;line-height:1.1;color:var(--navy)}
.stat span{font-size:.85rem;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;padding:12px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:center;font-weight:600;font-size:.88rem;line-height:1.2}
.tile .ic{font-size:1.7rem;line-height:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--tint)}
.tile:active{transform:scale(.97)}

/* page head */
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.phead h1{flex:1;font-size:1.45rem}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.6rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding-bottom:3px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sun{background:var(--sun);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem}
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=month],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:400}
textarea{min-height:88px;resize:vertical}
input[type=file]{width:100%;font-size:.9rem}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--btn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.9rem}
.chip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 16px}
.toolbar>input{flex:1;min-width:150px}

/* lists */
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list>li.tap{cursor:pointer}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--navy);display:grid;place-items:center;font-weight:700;font-family:"Baloo 2";overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:72px;height:72px;font-size:1.6rem}
.nm{font-weight:600;line-height:1.25}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--tint);color:var(--navy)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* attendance segmented */
.seg{display:flex;gap:6px;flex:none}
.seg button{width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
.seg button.on.P{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.A{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.L{background:var(--warn);border-color:var(--warn);color:#fff}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:12px 16px 0;padding:10px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dots i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:700;background:var(--bg);color:var(--muted)}
.dots i.P{background:var(--ok-bg);color:var(--ok)}
.dots i.A{background:var(--bad-bg);color:var(--bad)}
.dots i.L{background:var(--warn-bg);color:var(--warn)}

/* week table */
.week{display:grid;gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.day.today{border-color:var(--sun);box-shadow:0 0 0 2px color-mix(in srgb,var(--sun) 30%,transparent)}
.day h3{display:flex;justify-content:space-between;align-items:baseline}
.day h3 small{font-family:Mukta;font-weight:500;color:var(--muted);font-size:.85rem}
.day dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.day dt{color:var(--muted);font-size:.88rem}
.day dd{margin:0;font-weight:500}
.weeknav{display:flex;align-items:center;gap:8px;padding:6px 16px}
.weeknav b{flex:1;text-align:center;font-weight:600}

/* notices */
.notice{border-left:4px solid var(--sun)}
.notice.pin{border-left-color:var(--berry)}
.notice h3{margin-bottom:4px}
.notice p{white-space:pre-wrap}
.meta{font-size:.82rem;color:var(--muted);margin-top:8px}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:14px;overflow:hidden}
.gal button{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--tint);cursor:pointer;overflow:hidden}
.gal img,.gal video{width:100%;height:100%;object-fit:cover}
.gal .play{position:absolute;inset:auto 6px 6px auto;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:0 8px;font-size:.75rem}
.gal .lock{position:absolute;inset:6px auto auto 6px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:0 7px;font-size:.72rem}

/* toppers */
.stars{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.starcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.starcard .ph{aspect-ratio:1;background:radial-gradient(circle at 50% 110%,var(--sun) 0 38%,#FFE3B8 39% 100%);display:grid;place-items:center;font-family:"Baloo 2";font-size:2.6rem;color:var(--navy)}
.starcard .ph img{width:100%;height:100%;object-fit:cover}
.starcard .bd{padding:10px 12px 12px}
.starcard .ribbon{position:absolute;top:10px;left:10px;background:var(--berry);color:#fff;font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:999px}

/* tickets */
.msg{padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px}
.msg.staff{background:var(--tint)}
.msg p{white-space:pre-wrap}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button .ic{font-size:1.25rem;line-height:1.2}
.tabs button.on{color:var(--navy)}
.tabs button.on .ic{transform:translateY(-1px)}

/* sheet */
#sheet[hidden]{display:none}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.45)}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:6px;z-index:1}
.sheet .lightbox img,.sheet .lightbox video{width:100%;border-radius:12px;max-height:62vh;object-fit:contain;background:#000}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}

/* auth */
.auth{max-width:440px;margin:0 auto;padding:28px 20px 40px}
.auth .logo{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:var(--shadow)}
.auth h1{text-align:center}
.auth .sub{text-align:center;color:var(--muted);margin:4px 0 20px}
.tabsw{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);padding:4px;border-radius:12px;margin-bottom:16px}
.tabsw button{min-height:40px;border:0;border-radius:9px;background:none;font-weight:600;cursor:pointer}
.tabsw button.on{background:var(--card);box-shadow:var(--shadow)}
.banner{margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:.88rem;font-weight:500}
.splash{min-height:80vh;display:grid;place-items:center;text-align:center}
.splash img{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;background:#fff}


[hidden]{display:none!important}
.top .brand{flex:1;margin-left:10px}
.av.sm{width:34px;height:34px;font-size:.8rem;background:#fff}
.tabs .ic{position:relative}
.tabs .ic em{position:absolute;top:-4px;right:-14px;background:var(--berry);color:#fff;font-style:normal;font-size:.64rem;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.tabs .create{justify-content:center}
.tabs .create span{width:48px;height:36px;border-radius:12px;background:linear-gradient(135deg,#F7B733,#E8661E 55%,#A61E32);color:#fff;font-size:1.5rem;font-weight:700;display:grid;place-items:center}

/* drawer */
#drawer{position:fixed;inset:0;z-index:70}
#drawer .dbg{position:absolute;inset:0;background:rgba(10,14,30,.45);opacity:0;transition:opacity .22s}
#drawer nav{position:absolute;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--card);transform:translateX(-102%);transition:transform .25s ease;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:4px 0 24px rgba(0,0,0,.2)}
#drawer.open .dbg{opacity:1}
#drawer.open nav{transform:none}
.dhead{position:relative;overflow:hidden;height:170px;background:linear-gradient(180deg,#FFF6EA,#FFE2BC);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;color:#1B2340}
.dhead svg{position:absolute;right:-60px;bottom:0;width:125%;pointer-events:none}
.dhead .who{position:relative;z-index:1;display:flex;gap:10px;align-items:center}
.dhead .who b{font-family:"Baloo 2";font-size:1.15rem}
.dgroup{padding:14px 20px 4px;font-size:.82rem;color:var(--muted);font-weight:600}
.dlink{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:6px 20px;background:none;border:0;text-align:left;font-weight:600;font-size:1rem;cursor:pointer}
.dlink .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-size:1.1rem;flex:none}
.dlink.on{background:var(--tint);color:var(--navy)}
.dlink .badge{margin-left:auto;background:var(--berry);color:#fff;border-radius:999px;font-size:.75rem;padding:0 8px}
@media (prefers-reduced-motion:no-preference){
  #drawer.open .dhead .rays line{transform-origin:330px 150px;animation:rise .7s ease-out both}
  #drawer.open .dhead .sunball{animation:sunup .8s ease-out both}
}
@media (prefers-reduced-motion:reduce){#drawer nav,#drawer .dbg{transition:none}}

/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 14px 10px;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--card)}
.stories::-webkit-scrollbar{display:none}
.sring{position:relative;flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;font-size:.76rem;font-weight:600}
.sring .ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#F7B733,#E8661E,#A61E32,#F7B733)}
.sring.seen .ring{background:var(--line)}
.sring.add .ring{background:none;padding:3px;border:2px dashed var(--line)}
.sring .in{width:100%;height:100%;border-radius:50%;border:3px solid var(--card);overflow:hidden;background:#fff;display:grid;place-items:center;font-family:"Baloo 2";font-size:1.2rem;color:#243A73}
.sring .in img{width:100%;height:100%;object-fit:cover}
.sring .plus{position:absolute;top:50px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--sun);color:#fff;border:2px solid var(--card);display:grid;place-items:center;font-size:.95rem;line-height:1}
.sring .lbl{max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* today strip */
.today{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none}
.today::-webkit-scrollbar{display:none}
.today>button{flex:none;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:52px}
.today b{font-family:"Baloo 2";font-size:1.2rem;color:var(--navy);line-height:1}
.today span{font-size:.8rem;color:var(--muted);line-height:1.2}

/* feed */
.feed{padding-bottom:8px}
.post{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
@media (min-width:560px){.post{border:1px solid var(--line);border-radius:18px;margin:14px 16px 0;overflow:hidden}}
.phd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.media{position:relative;background:#000;aspect-ratio:4/5;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.media .mute{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:.85rem}
.pop{position:absolute;inset:0;display:grid;place-items:center;font-size:6rem;pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}
.acts{display:flex;align-items:center;padding:4px 6px 0}
.acts button{width:44px;height:44px;border:0;background:none;font-size:1.45rem;cursor:pointer}
.pbody{padding:0 14px 14px}
.pbody p{margin-top:2px}

/* create */
.makers{display:grid;gap:10px;padding-bottom:6px}
.maker{display:grid;grid-template-columns:52px 1fr;column-gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1rem}
.maker>span{grid-row:span 2;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--card)}
.maker small{color:var(--muted)}
.cprev{border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px}
.cprev img,.cprev video{width:100%;max-height:42vh;object-fit:contain}
.shareto{border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:0 0 8px}
.shareto legend{font-weight:600;font-size:.9rem;padding:0 4px}

/* camera + story (full screen) */
#cam,#story{position:fixed;inset:0;z-index:90;background:#000;color:#fff;display:flex;flex-direction:column}
.camtop{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px}
.cbtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.05rem;cursor:pointer;flex:none}
.ctime{background:#E0312B;padding:2px 12px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.camstage{flex:1;position:relative;overflow:hidden}
.camstage video,.camstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camPrev,#camShot{object-fit:contain}
.mirror{transform:scaleX(-1)}
.cambar{padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.cambar.done{flex-direction:row}
.cambar.done .btn{flex:1}
.cmodes{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.cmodes button{border:0;background:none;color:#fff;padding:6px 18px;border-radius:999px;font-weight:600;cursor:pointer}
.cmodes button.on{background:#fff;color:#000}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;cursor:pointer}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:all .2s}
.shutter.video i{background:#E0312B}
.shutter.rec i{border-radius:10px;transform:scale(.55)}
.sbars{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px}
.sbars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.sbars i b{display:block;height:100%;background:#fff;width:0}
.shead{display:flex;align-items:center;gap:10px;padding:4px 12px 8px}
.sstage{flex:1;position:relative;overflow:hidden}
.sstage img,.sstage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stap{position:absolute;top:0;bottom:0;width:40%;background:none;border:0;cursor:pointer;z-index:1}
.stap.l{left:0}.stap.r{right:0}
.scap{padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;min-height:52px}

input[type=email]{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
a.btn{text-decoration:none}
.fh{margin:16px 0 8px;font-size:1.02rem;color:var(--navy)}
.sp-top{display:flex;align-items:center;gap:18px}
.dp{position:relative;flex:none;background:none;border:0;padding:0;cursor:pointer}
.dp:disabled{cursor:default}
.dpring{display:block;width:98px;height:98px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#F7B733,#E8661E,#A61E32,#F7B733)}
.dpin{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:3px solid var(--card);overflow:hidden;background:var(--tint);font-family:"Baloo 2";font-size:2.1rem;font-weight:700;color:var(--navy)}
.dpin img{width:100%;height:100%;object-fit:cover}
.dpcam{position:absolute;right:0;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--sun);border:3px solid var(--card);display:grid;place-items:center;font-size:.85rem}
.sp-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.sp-stats b{display:block;font-family:"Baloo 2";font-size:1.35rem;color:var(--navy);line-height:1.1}
.sp-stats span{font-size:.78rem;color:var(--muted)}
.sprof h2{margin-top:12px;font-size:1.4rem}
.tag.cls{background:linear-gradient(135deg,#F7B733,#E8661E);color:#fff}
.pcard{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.pcard:first-child{border-top:0;padding-top:0}
.pic{width:44px;height:44px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:1.25rem;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0}
.kv dt{color:var(--muted);font-size:.88rem}
.kv dd{margin:0;font-weight:500;word-break:break-word}
button,.media,.tile,.chip,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#toast{z-index:95!important;position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#1B2340;color:#fff;padding:10px 16px;border-radius:12px;font-weight:500;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.scroll-x{overflow-x:auto}
table.fees{width:100%;border-collapse:collapse;font-size:.92rem}
table.fees td,table.fees th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
table.fees th{color:var(--muted);font-weight:600;border-top:0}
</style>
</head>
<body>
<div id="app" class="shell"></div>
<div id="sheet" hidden></div>
<div id="drawer" hidden></div>
<div id="story" hidden role="dialog" aria-modal="true" aria-label="Stories"></div>
<div id="cam" hidden role="dialog" aria-modal="true" aria-label="Camera"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const z = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const weekKey = d => { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return ymd(x); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtDate = s => { if (!s) return ""; const d = parse(s); return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); };
const fmtDay = s => { const d = parse(s); return WD[d.getDay()] + ", " + d.getDate() + " " + MON[d.getMonth()]; };
const fmtMonth = s => { if (!s) return ""; const [y,m] = s.split("-").map(Number); return MON[m-1] + " " + y; };
const fmtTime = t => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()] + ", " + z(d.getHours()) + ":" + z(d.getMinutes()); };
const clsName = id => (CLASSES.find(c => c.id === id) || {}).name || id || "";
const initials = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const dayKeyOf = s => { const i = (parse(s).getDay() + 6) % 7; return DAYS[i] || null; };
const ls = {
  get(k, d) { try { const v = localStorage.getItem("aarambh:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("aarambh:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("aarambh:" + k); } catch {} }
};
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2800);
}
async function hash(s) {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("aarambh:" + s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return "h" + h; }
}
function friendlyError(e) {
  const code = e && e.code;
  if (code === "permission-denied") return "You don't have permission to do that. Ask the school admin.";
  if (code === "unavailable" && Store.mode === "server") return "No internet connection. Your change will sync when you're back online.";
  if (code === "invalid_argument") return "You don't have permission to save here. Ask the school admin for Contributor access to this app.";
  if (code === "quota_exceeded") return "Storage is full. Ask the admin to delete old gallery items or records.";
  if (code === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  if (code === "revoked") return "Access to this app was changed. Reload the page.";
  return (e && e.message) || "Couldn't save. Check your connection and try again.";
}

/* ---------- storage: shared (cloud) or this device (local) ---------- */
const Store = {
  mode: "local", db: null, assets: null, data: {}, loaded: new Set(), first: {},
  initLocal() { this.mode = "local"; COLLS.forEach(c => { this.data[c] = ls.get("c:" + c, {}); this.loaded.add(c); }); },
  initCloud(db, assets) {
    this.mode = "cloud"; this.db = db; this.assets = assets;
    COLLS.forEach(c => {
      this.data[c] = {};
      db.collection(c).onSnapshot(snap => {
        const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
        this.data[c] = o;
        const firstLoad = !this.loaded.has(c);
        this.loaded.add(c);
        if (!firstLoad) onRemoteChange(c, snap);
        scheduleRender();
      }, err => { if (err && err.code !== "unavailable") toast(friendlyError(err)); });
    });
  },
  raw(c, id) { return (this.data[c] || {})[id] || null; },
  get(c, id) { const r = this.raw(c, id); return r ? { id, ...r } : null; },
  all(c) { return Object.entries(this.data[c] || {}).map(([id, d]) => ({ id, ...d })); },
  async set(c, id, obj) {
    const clean = JSON.parse(JSON.stringify(obj));
    if (this.mode === "cloud") { await this.db.collection(c).doc(id).set(clean); return; }
    this.data[c] = { ...this.data[c], [id]: clean };
    try { localStorage.setItem("aarambh:c:" + c, JSON.stringify(this.data[c])); }
    catch { throw new Error("This device is out of storage. Remove some photos and try again."); }
    scheduleRender();
  },
  async patch(c, id, part) {
    const cur = this.raw(c, id);
    const merged = deepMerge(cur ? JSON.parse(JSON.stringify(cur)) : {}, part);
    if (this.mode === "cloud" && cur) { await this.db.collection(c).doc(id).update(JSON.parse(JSON.stringify(part))); return; }
    return this.set(c, id, merged);
  },
  async del(c, id) {
    if (this.mode === "cloud") { await this.db.collection(c).doc(id).delete(); return; }
    const o = { ...this.data[c] }; delete o[id]; this.data[c] = o;
    ls.set("c:" + c, o); scheduleRender();
  }
};
function deepMerge(a, b) {
  for (const k in b) {
    if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) a[k] = deepMerge(a[k], b[k]);
    else a[k] = b[k];
  }
  return a;
}

function shrink(file, maxDim, q, as) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxDim / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      if (as === "dataurl") res(cv.toDataURL("image/jpeg", q));
      else cv.toBlob(b => b ? res(b) : rej(new Error("Couldn't read that image.")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Couldn't read that image. Try a JPG or PNG.")); };
    img.src = url;
  });
}
async function saveMedia(file, maxDim = 1400) {
  if (!file || !file.size) return null;
  const isVideo = (file.type || "").startsWith("video/");
  if (!isVideo && !(file.type || "").startsWith("image/")) throw new Error("Choose a photo or a video file.");
  if (Store.uploadMedia) return Store.uploadMedia(file, maxDim, isVideo);
  if (Store.mode === "cloud") {
    if (!Store.assets) throw new Error("Uploading photos needs editor access to this app. Ask the app owner.");
    const blob = isVideo ? new Blob([file], { type: (file.type || "video/mp4").split(";")[0] }) : await shrink(file, maxDim, 0.85, "blob");
    if (blob.size > 20 * 1024 * 1024) throw new Error("That file is over 20 MB. Choose a shorter video.");
    const r = await Store.assets.upload(blob);
    return { assetId: r.id, kind: isVideo ? "video" : "image" };
  }
  if (isVideo) throw new Error("Videos can only be added in the shared online version of the app.");
  return { dataUrl: await shrink(file, Math.min(maxDim, 720), 0.7, "dataurl"), kind: "image" };
}

function viewAuth() {
  const cloud = Store.mode === "cloud";

  const owner = cloud && S.isOwner;
  const tab = cloud ? "signup" : (firstUser ? "signup" : S.authTab);
  const roleField = (owner || (!cloud && firstUser))
    ? `<input type="hidden" name="role" value="admin"><p class="small muted" style="margin-bottom:12px">${owner ? "You own this app, so you'll be the school admin." : "The first account becomes the school admin."}</p>`
    : `<label class="f"><span>I am a</span><select name="role" data-change="authRole"><option value="parent">Parent</option><option value="staff">Teacher / Staff</option></select></label>
       <div id="childFields"><label class="f"><span>Child's name</span><input type="text" name="childName" autocomplete="off"></label>
       <label class="f"><span>Child's class</span><select name="childCls">${CLASSES.map(c => `<option value="${c.id}">${c.name}</option>`).join("")}</select></label></div>`;
  const signup = `<form data-form="signup">
    <label class="f"><span>Full name</span><input type="text" name="name" required autocomplete="name"></label>
    <label class="f"><span>Mobile number</span><input type="tel" name="phone" required inputmode="tel" autocomplete="tel" pattern="[0-9+ ]{10,15}"></label>
    ${cloud ? "" : `<label class="f"><span>Create password</span><input type="password" name="pass" required minlength="6" autocomplete="new-password"></label>`}
    ${roleField}
    <button class="btn block sun">${owner || (!cloud && firstUser) ? "Create admin account" : "Sign up"}</button>
    ${owner || (!cloud && firstUser) ? "" : `<p class="small muted" style="margin-top:10px;text-align:center">The school admin approves new accounts before you can sign in.</p>`}
  </form>`;
  const login = `<form data-form="login">
    <label class="f"><span>Mobile number</span><input type="tel" name="phone" required inputmode="tel" autocomplete="tel"></label>
    <label class="f"><span>Password</span><input type="password" name="pass" required autocomplete="current-password"></label>
    <button class="btn block">Log in</button></form>`;
  return `<div class="auth"><img class="logo" src="${LOGO}" alt="Aarambh Pre School logo, under the auspices of R.L.J.D. Group">
    <h1>Welcome to Aarambh</h1><p class="sub">${cloud ? "Tell us who you are to join the school app." : "Log in or create your account."}</p>
    ${cloud ? "" : `<div class="tabsw" role="tablist"><button class="${tab === "login" ? "on" : ""}" data-act="authTab" data-t="login" role="tab">Log in</button><button class="${tab === "signup" ? "on" : ""}" data-act="authTab" data-t="signup" role="tab">Sign up</button></div>`}
    <div class="card">${tab === "login" ? login : signup}</div></div>`;
}
function viewPending(m) {
  const rejected = m.status === "rejected";

function sunriseSvg() {
  let rays = "";
  for (let a = 12; a <= 168; a += 13) {
    const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    rays += `<line x1="${(330 + c * 72).toFixed(1)}" y1="${(150 - s * 72).toFixed(1)}" x2="${(330 + c * (a % 26 === 12 ? 120 : 102)).toFixed(1)}" y2="${(150 - s * (a % 26 === 12 ? 120 : 102)).toFixed(1)}"/>`;
  }
  return `<svg viewBox="0 0 420 160" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7B733"/><stop offset="1" stop-color="#E8661E"/></linearGradient></defs>
  <g class="rays" stroke="#C8702F" stroke-width="6" stroke-linecap="round">${rays}</g>
  <circle class="sunball" cx="330" cy="150" r="58" fill="url(#sg)"/>
  <path d="M0 160 C120 120 300 118 420 136 L420 160 Z" fill="#4E9A2E"/></svg>`;
}
function storiesBar() {
  const gs = storyGroups(), seen = new Set(ls.get("sseen:" + S.meId, []));
  const add = isStaff() ? `<button class="sring add" data-act="create" data-t="story"><span class="ring"><span class="in">📷</span></span><span class="plus" aria-hidden="true">+</span><span class="lbl">Add story</span></button>` : "";
  const rings = gs.map((g, i) => {
    const all = g.items.every(x => seen.has(x.id)), last = g.items[g.items.length - 1];
    const thumb = g.key === "all" ? `<img src="${LOGO}" alt="">` : last.kind === "image" ? `<img src="${esc(mediaSrc(last))}" alt="">` : esc(initials(g.name));
    return `<button class="sring ${all ? "seen" : ""}" data-act="story" data-i="${i}" aria-label="${esc(g.name)} story${all ? "" : ", new"}"><span class="ring"><span class="in">${thumb}</span></span><span class="lbl">${esc(g.name)}</span></button>`;
  }).join("");
  if (!add && !rings) return "";
  return `<div class="stories" aria-label="Stories">${add}${rings}</div>`;
}
function todayStrip() {
  const t = today(), m = me();
  if (m.role === "parent") {
    const kids = myKids(); if (!kids.length) return "";
    return `<div class="today">${kids.map(k => { const d = Store.raw("attStudents", t + "_" + k.cls); const mk = d && d.marks ? d.marks[k.id] : null;
      return `<button data-act="child" data-id="${k.id}">${avatar(k.name, k.photo)}<div><div style="font-weight:600">${esc(k.name.split(" ")[0])}</div><span class="tag ${mk === "P" ? "ok" : mk === "A" ? "bad" : mk === "L" ? "warn" : ""}">${mk === "P" ? "Present today" : mk === "A" ? "Absent today" : mk === "L" ? "On leave" : "Not marked yet"}</span></div></button>`; }).join("")}</div>`;
  }
  const total = students().length; let present = 0;
  CLASSES.forEach(c => { const d = Store.raw("attStudents", t + "_" + c.id); if (d && d.marks) Object.values(d.marks).forEach(v => { if (v === "P") present++; }); });
  const sd = Store.raw("attStaff", t); const staffP = sd && sd.marks ? Object.values(sd.marks).filter(v => (v.k || v) === "P").length : 0;
  const openT = Store.all("tickets").filter(x => x.status !== "closed" && (isAdmin() || x.by === S.meId)).length;
  return `<div class="today"><button data-act="go" data-v="studentAtt"><b>${present}/${total}</b><span>Students<br>present</span></button><button data-act="go" data-v="staffAtt"><b>${staffP}/${approvedStaff().length}</b><span>Staff<br>present</span></button><button data-act="go" data-v="helpdesk"><b>${openT}</b><span>Open<br>requests</span></button>${isAdmin() ? `<button data-act="go" data-v="admin"><b>${pendingCount()}</b><span>Accounts to<br>approve</span></button>` : ""}</div>`;
}

  return `<article class="post"><div class="phd"><span class="av sm"><img src="${LOGO}" alt=""></span><div class="grow nm">${esc(by.name || "Aarambh Pre School")}<small>${x.cls && x.cls !== "all" ? clsName(x.cls) + " · " : ""}${ago(x.createdAt)}</small></div>${isStaff() ? `<button class="icon-btn" data-act="postMenu" data-id="${x.id}" aria-label="Post options">⋯</button>` : ""}</div>

function viewStudentAtt() {
  const key = S.attDate + "_" + S.attCls, doc = Store.raw("attStudents", key);
  if (!S.attDraft || S.attDraft.key !== key || (!S.attDraft.dirty && doc !== S.attDraft.src)) S.attDraft = { key, src: doc, dirty: false, marks: { ...((doc && doc.marks) || {}) } };
  const mk = S.attDraft.marks, list = studentsIn(S.attCls);
  const c = { P: 0, A: 0, L: 0 }; list.forEach(s => { if (mk[s.id]) c[mk[s.id]]++; });
  return pageHead("Student attendance") +
  `<div class="toolbar"><input type="date" value="${S.attDate}" max="${today()}" data-change="attDate" aria-label="Date"></div>
   <div style="padding:0 16px">${clsChips(S.attCls, "attCls")}</div>
   <div class="section" style="margin-top:6px">${list.length ? `<p class="small muted" style="margin-bottom:8px">${c.P} present · ${c.A} absent · ${c.L} leave · ${list.length - c.P - c.A - c.L} not marked</p>
   <ul class="list">${list.map(s => `<li>${avatar(s.name, s.photo)}<span class="grow nm">${esc(s.name)}</span><span class="seg" role="group" aria-label="${esc(s.name)}">${["P", "A", "L"].map(k => `<button class="${mk[s.id] === k ? "on " + k : ""}" aria-pressed="${mk[s.id] === k}" data-act="markStu" data-id="${s.id}" data-k="${k}" title="${k === "P" ? "Present" : k === "A" ? "Absent" : "Leave"}">${k}</button>`).join("")}</span></li>`).join("")}</ul>`
   : empty(`No students in ${clsName(S.attCls)} yet.`, `<button class="btn" data-act="go" data-v="students">Add students</button>`)}</div>
   ${list.length ? `<div class="savebar"><button class="btn ghost sm" data-act="allPresent">All present</button><span class="grow small muted">${S.attDraft.dirty ? "Unsaved changes" : doc ? "Saved" : ""}</span><button class="btn" data-act="saveAtt" ${S.attDraft.dirty ? "" : "disabled"}>Save</button></div>` : ""}`;
}

function viewDatesheet() {

  let list = Store.all("datesheet").sort((a, b) => a.date.localeCompare(b.date) || (a.time || "").localeCompare(b.time || ""));

function openSheet(title, body, onSubmit, submitLabel) {

  S.sheetSubmit = onSubmit; sh.hidden = false; document.body.style.overflow = "hidden";
  const f = sh.querySelector("input:not([type=hidden]),textarea,select"); if (f && window.innerWidth > 700) f.focus();
}
function closeSheet() { const sh = $("#sheet"); sh.hidden = true; sh.innerHTML = ""; document.body.style.overflow = ""; S.sheetSubmit = null; }
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#cam").hidden) closeCam(); else if (!$("#story").hidden) closeStories(); else if (!$("#sheet").hidden) closeSheet(); else closeMenu();
  if (!$("#story").hidden) return;
});
document.addEventListener("keydown", e => { if ($("#story").hidden) return; if (e.key === "ArrowRight") storyNext(); if (e.key === "ArrowLeft") storyPrev(); });
let touch0 = null;
document.addEventListener("touchstart", e => { const t = e.touches[0]; touch0 = { x: t.clientX, y: t.clientY }; }, { passive: true });
document.addEventListener("touchend", e => {
  if (!touch0) return; const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y, sx = touch0.x; touch0 = null;
  if (!$("#story").hidden) { if (dy > 90 && Math.abs(dx) < 60) closeStories(); return; }
  if (!$("#cam").hidden || !$("#sheet").hidden) return;
  const open = $("#drawer").classList.contains("open");
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) { if (!open && dx > 0 && sx < 32) openMenu(); else if (open && dx < 0) closeMenu(); }
}, { passive: true });

}

    if (cloud && S.isOwner) r = "admin";

    if (cloud && !S.isOwner && r === "admin") r = "parent";
    const doc = { name, phone, role: r, status: r === "admin" ? "approved" : "pending", studentIds: [], createdAt: Date.now() };
    if (r === "parent") { doc.childName = (fd.get("childName") || "").trim(); doc.childCls = fd.get("childCls"); }
    if (!cloud) {
      if (members().some(m => m.phone === phone)) throw new Error("An account with this mobile number already exists. Log in instead.");
      doc.passHash = await hash(fd.get("pass"));
      const id = newId(); await Store.set("members", id, doc); S.meId = id; ls.set("session", id);
    } else {
      await Store.set("members", S.meId, doc);
    }
    render(true);

  login: async fd => {
    const phone = fd.get("phone").trim(), h = await hash(fd.get("pass"));
    const m = members().find(x => x.phone === phone && x.passHash === h);
    if (!m) throw new Error("Mobile number or password is wrong.");
    S.meId = m.id; ls.set("session", m.id); S.view = "home"; render(true);
  },
  reply: async (fd, form) => {
    const id = form.dataset.id, x = Store.raw("tickets", id);
    const replies = [...(x.replies || []), { by: S.meId, text: fd.get("text").trim(), at: Date.now() }];
    await Store.patch("tickets", id, { replies, updatedAt: Date.now() });
    form.reset(); toast("Reply sent"); render(true);
  }
};

/* ---------- event wiring ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.tagName === "BUTTON" && t.type === "submit") e.preventDefault();
  fn(t.dataset, t, e);
});
document.addEventListener("submit", async e => {
  const form = e.target; e.preventDefault();
  const btn = form.querySelector("button:not([type=button])"); const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; if (form.id === "sheetForm") btn.textContent = "Saving…"; }
  try {
    if (form.id === "sheetForm" && S.sheetSubmit) { await S.sheetSubmit(new FormData(form), form); closeSheet(); }
    else if (form.dataset.form && F[form.dataset.form]) await F[form.dataset.form](new FormData(form), form);
  } catch (err) { toast(friendlyError(err)); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
});
const C = {
  attDate: v => { if (v) { S.attDate = v; render(true); } },
  staffDate: v => { if (v) { S.staffDate = v; render(true); } },
  theme: v => { ls.set("theme", v); if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; },
  authRole: v => { const cf = $("#childFields"); if (cf) cf.hidden = v !== "parent"; }
};
document.addEventListener("change", e => {
  const pk = e.target.dataset && e.target.dataset.pick;
  if (pk && e.target.files && e.target.files[0]) { const f = e.target.files[0]; closeSheet(); if (pk.startsWith("dp:")) setDp(f, pk); else compose(f, pk); return; }
  const n = e.target.dataset && e.target.dataset.change; if (n && C[n]) C[n](e.target.value, e.target); });
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.input === "stuQ") { S.stuQ = e.target.value; const l = $("#stuList"); if (l) l.innerHTML = studentsListHtml(); }
});

/* ---------- boot ---------- */
(async function boot() {
  const th = ls.get("theme", ""); if (th) document.documentElement.dataset.theme = th;
  render(true);
  if (window.AARAMBH_BACKEND) return;
  let db = null, user = null, assets = null;
  if (window.claude && typeof window.claude.use === "function") {
    const wait = p => Promise.race([p.catch(() => null), new Promise(r => setTimeout(() => r(null), 9000))]);
    [db, user, assets] = await Promise.all([wait(claude.use("db")), wait(claude.use("user")), wait(claude.use("assets"))]);
  }
  const uid = user ? await user.id() : null;
  if (db && uid) {
    S.meId = uid; S.isOwner = await user.isOwner();
    Store.initCloud(db, assets);
  } else {
    Store.initLocal(); S.meId = ls.get("session", null);
    if (S.meId && !Store.raw("members", S.meId)) { S.meId = null; ls.del("session"); }
  }
  S.ready = true; render(true);
  setTimeout(() => { if (me()) cleanupStories(); }, 8000);
})();
</script>
